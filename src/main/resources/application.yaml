spring:
  application:
    name: innovation

  datasource:
    url: jdbc:mysql://localhost:3306/innovation
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

server:
  port: 8081
  servlet:
    context-path: /api/v1

security:
  jwt:
    secret-key: ${env.jwt.secret-key} # Clave secreta (openssl rand -base64 32)
    token-expiration: ${env.jwt.token-expiration} # 10 min expresado en milisegundos
